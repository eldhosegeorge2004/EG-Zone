<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="moleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="50%" stop-color="#3f6212" />
      <stop offset="100%" stop-color="#65a30d" />
    </linearGradient>
    <radialGradient id="holeGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="70%" stop-color="#292524" />
      <stop offset="100%" stop-color="#44403c" />
    </radialGradient>
    <filter id="popShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#moleBg)" />

  <!-- Grass elements -->
  <ellipse cx="200" cy="380" rx="90" ry="25" fill="#15803d" opacity="0.5" />
  <ellipse cx="400" cy="390" rx="100" ry="28" fill="#15803d" opacity="0.6" />
  <ellipse cx="600" cy="380" rx="90" ry="25" fill="#15803d" opacity="0.5" />

  <!-- 3 Mole Holes -->
  <!-- Left Hole -->
  <ellipse cx="200" cy="360" rx="80" ry="32" fill="url(#holeGrad)" stroke="#57534e" stroke-width="4" />
  
  <!-- Right Hole -->
  <ellipse cx="600" cy="360" rx="80" ry="32" fill="url(#holeGrad)" stroke="#57534e" stroke-width="4" />

  <!-- Center Hole with Mole popping up -->
  <ellipse cx="400" cy="360" rx="95" ry="38" fill="url(#holeGrad)" stroke="#78716c" stroke-width="6" />

  <!-- Mole Character in Center Hole -->
  <g transform="translate(400, 270)" filter="url(#popShadow)">
    <!-- Mole Body -->
    <ellipse cx="0" cy="10" rx="65" ry="75" fill="#78350f" />
    <!-- Mole Snout -->
    <ellipse cx="0" cy="20" rx="35" ry="25" fill="#fed7aa" />
    <!-- Mole Nose -->
    <ellipse cx="0" cy="12" rx="12" ry="9" fill="#1c1917" />
    <!-- Mole Eyes -->
    <circle cx="-24" cy="-14" r="8" fill="#000000" />
    <circle cx="24" cy="-14" r="8" fill="#000000" />
    <circle cx="-22" cy="-16" r="3" fill="#ffffff" />
    <circle cx="26" cy="-16" r="3" fill="#ffffff" />
    <!-- Whiskers -->
    <line x1="-30" y1="20" x2="-60" y2="15" stroke="#1c1917" stroke-width="3" />
    <line x1="-30" y1="26" x2="-58" y2="28" stroke="#1c1917" stroke-width="3" />
    <line x1="30" y1="20" x2="60" y2="15" stroke="#1c1917" stroke-width="3" />
    <line x1="30" y1="26" x2="58" y2="28" stroke="#1c1917" stroke-width="3" />
    <!-- Mole Teeth -->
    <rect x="-8" y="32" width="7" height="9" rx="2" fill="#ffffff" />
    <rect x="1" y="32" width="7" height="9" rx="2" fill="#ffffff" />
  </g>

  <!-- Mallet / Hammer -->
  <g transform="translate(490, 160) rotate(25)" filter="url(#popShadow)">
    <!-- Handle -->
    <rect x="-8" y="40" width="16" height="110" rx="6" fill="#f59e0b" stroke="#b45309" stroke-width="2" />
    <!-- Hammer Head -->
    <rect x="-40" y="0" width="80" height="45" rx="8" fill="#dc2626" stroke="#991b1b" stroke-width="4" />
    <rect x="-35" y="8" width="70" height="10" rx="3" fill="#ef4444" />
  </g>

  <!-- Title Text -->
  <text x="400" y="480" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">WHACK-A-MOLE</text>
  <text x="400" y="525" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#bef264" text-anchor="middle" letter-spacing="3">REFLEX ARCADE CLASSIC</text>
</svg>
