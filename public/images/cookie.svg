<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cookieBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <radialGradient id="cookieDough" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </radialGradient>
    <filter id="cookieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#cookieBg)" />

  <!-- Sparkles / Floating effects -->
  <circle cx="180" cy="140" r="12" fill="#fde68a" opacity="0.6" />
  <circle cx="620" cy="180" r="16" fill="#fde68a" opacity="0.5" />
  <circle cx="680" cy="380" r="10" fill="#fde68a" opacity="0.4" />
  <circle cx="140" cy="420" r="14" fill="#fde68a" opacity="0.5" />

  <!-- Giant Cookie Center -->
  <g transform="translate(400, 240)" filter="url(#cookieShadow)">
    <!-- Base Cookie Circle -->
    <circle cx="0" cy="0" r="130" fill="url(#cookieDough)" stroke="#f59e0b" stroke-width="6" />

    <!-- Chocolate Chips -->
    <ellipse cx="-45" cy="-55" rx="16" ry="13" fill="#451a03" />
    <ellipse cx="35" cy="-60" rx="18" ry="14" fill="#451a03" />
    <ellipse cx="-70" cy="10" rx="17" ry="15" fill="#451a03" />
    <ellipse cx="10" cy="-5" rx="20" ry="16" fill="#451a03" />
    <ellipse cx="65" cy="15" rx="15" ry="13" fill="#451a03" />
    <ellipse cx="-35" cy="65" rx="18" ry="15" fill="#451a03" />
    <ellipse cx="40" cy="70" rx="16" ry="14" fill="#451a03" />

    <!-- Highlights on Chips -->
    <circle cx="-42" cy="-58" r="4" fill="#78350f" />
    <circle cx="38" cy="-63" r="4" fill="#78350f" />
    <circle cx="13" cy="-8" r="5" fill="#78350f" />
    <circle cx="-32" cy="62" r="4" fill="#78350f" />
  </g>

  <!-- Floating Text "+1" -->
  <text x="560" y="160" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#fbbf24" opacity="0.9">+1</text>
  <text x="220" y="200" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#f59e0b" opacity="0.8">+10</text>

  <!-- Title Text -->
  <text x="400" y="460" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">COOKIE CLICKER</text>
  <text x="400" y="510" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="3">ENDLESS IDLE BAKING TYCOON</text>
</svg>
