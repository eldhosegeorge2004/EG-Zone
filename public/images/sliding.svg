<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="tileDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Grid Container -->
  <g transform="translate(230, 80)">
    <!-- Board Base -->
    <rect width="340" height="340" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="6" filter="url(#shadow)" />

    <!-- Tile 1 -->
    <rect x="20" y="20" width="65" height="65" rx="12" fill="url(#tileGrad)" filter="url(#shadow)" />
    <text x="52.5" y="62" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

    <!-- Tile 2 -->
    <rect x="95" y="20" width="65" height="65" rx="12" fill="url(#tileGrad)" filter="url(#shadow)" />
    <text x="127.5" y="62" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

    <!-- Tile 3 -->
    <rect x="170" y="20" width="65" height="65" rx="12" fill="url(#tileGrad)" filter="url(#shadow)" />
    <text x="202.5" y="62" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

    <!-- Tile 4 -->
    <rect x="245" y="20" width="65" height="65" rx="12" fill="url(#tileGrad)" filter="url(#shadow)" />
    <text x="277.5" y="62" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>

    <!-- Row 2 -->
    <rect x="20" y="95" width="65" height="65" rx="12" fill="url(#tileGrad)" filter="url(#shadow)" />
    <text x="52.5" y="137" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>

    <rect x="95" y="95" width="65" height="65" rx="12" fill="url(#tileGrad)" filter="url(#shadow)" />
    <text x="127.5" y="137" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>

    <rect x="170" y="95" width="65" height="65" rx="12" fill="url(#tileGrad)" filter="url(#shadow)" />
    <text x="202.5" y="137" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>

    <rect x="245" y="95" width="65" height="65" rx="12" fill="url(#tileGrad)" filter="url(#shadow)" />
    <text x="277.5" y="137" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>

    <!-- Row 3 -->
    <rect x="20" y="170" width="65" height="65" rx="12" fill="url(#tileGrad)" filter="url(#shadow)" />
    <text x="52.5" y="212" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">9</text>

    <rect x="95" y="170" width="65" height="65" rx="12" fill="url(#tileGrad)" filter="url(#shadow)" />
    <text x="127.5" y="212" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">10</text>

    <rect x="170" y="170" width="65" height="65" rx="12" fill="url(#tileDark)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)" />
    <text x="202.5" y="212" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#38bdf8" text-anchor="middle">11</text>

    <rect x="245" y="170" width="65" height="65" rx="12" fill="url(#tileGrad)" filter="url(#shadow)" />
    <text x="277.5" y="212" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">12</text>

    <!-- Row 4 -->
    <rect x="20" y="245" width="65" height="65" rx="12" fill="url(#tileGrad)" filter="url(#shadow)" />
    <text x="52.5" y="287" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">13</text>

    <rect x="95" y="245" width="65" height="65" rx="12" fill="url(#tileGrad)" filter="url(#shadow)" />
    <text x="127.5" y="287" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">14</text>

    <rect x="170" y="245" width="65" height="65" rx="12" fill="url(#tileDark)" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4 4" />
    <text x="202.5" y="287" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#2dd4bf" text-anchor="middle">→</text>

    <!-- Empty slot at 245, 245 with faint glow -->
    <rect x="245" y="245" width="65" height="65" rx="12" fill="#090d18" stroke="#1e293b" stroke-width="2" />
  </g>

  <!-- Title Text -->
  <text x="400" y="480" font-family="system-ui, sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">SLIDING PUZZLE</text>
  <text x="400" y="525" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#2dd4bf" text-anchor="middle" letter-spacing="3">CLASSIC 15-PUZZLE BRAIN TEASER</text>
</svg>
