<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bubbleBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e0854" />
      <stop offset="50%" stop-color="#18042b" />
      <stop offset="100%" stop-color="#090214" />
    </linearGradient>

    <!-- Bubble gradients -->
    <radialGradient id="bPink" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="40%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#9d174d" />
    </radialGradient>
    <radialGradient id="bPurple" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </radialGradient>
    <radialGradient id="bBlue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
    <radialGradient id="bGreen" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bbf7d0" />
      <stop offset="40%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </radialGradient>
    <radialGradient id="bYellow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </radialGradient>
    <radialGradient id="bRed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fecaca" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>

    <linearGradient id="cannonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <filter id="bubbleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bubbleBg)" />

  <!-- Background Ambient Glows -->
  <circle cx="400" cy="180" r="240" fill="#a855f7" opacity="0.12" filter="url(#bubbleGlow)" />
  <circle cx="200" cy="400" r="180" fill="#ec4899" opacity="0.1" filter="url(#bubbleGlow)" />

  <!-- Star sparkles -->
  <circle cx="100" cy="120" r="2" fill="#f472b6" opacity="0.7" />
  <circle cx="700" cy="100" r="2.5" fill="#c084fc" opacity="0.8" />
  <circle cx="740" cy="380" r="1.5" fill="#f472b6" opacity="0.6" />
  <circle cx="80" cy="450" r="2" fill="#c084fc" opacity="0.6" />
  <circle cx="650" cy="480" r="2" fill="#f472b6" opacity="0.5" />

  <!-- Hexagonal Bubble Ceiling Pattern -->
  <!-- Row 0 -->
  <circle cx="160" cy="70" r="32" fill="url(#bPink)" filter="url(#bubbleGlow)" />
  <circle cx="224" cy="70" r="32" fill="url(#bPurple)" />
  <circle cx="288" cy="70" r="32" fill="url(#bPink)" />
  <circle cx="352" cy="70" r="32" fill="url(#bBlue)" />
  <circle cx="416" cy="70" r="32" fill="url(#bBlue)" />
  <circle cx="480" cy="70" r="32" fill="url(#bYellow)" />
  <circle cx="544" cy="70" r="32" fill="url(#bGreen)" />
  <circle cx="608" cy="70" r="32" fill="url(#bGreen)" />
  <circle cx="672" cy="70" r="32" fill="url(#bRed)" />

  <!-- Row 1 (offset) -->
  <circle cx="192" cy="125" r="32" fill="url(#bPurple)" />
  <circle cx="256" cy="125" r="32" fill="url(#bPink)" />
  <circle cx="320" cy="125" r="32" fill="url(#bPink)" filter="url(#bubbleGlow)" />
  <circle cx="384" cy="125" r="32" fill="url(#bBlue)" />
  <circle cx="448" cy="125" r="32" fill="url(#bYellow)" />
  <circle cx="512" cy="125" r="32" fill="url(#bYellow)" />
  <circle cx="576" cy="125" r="32" fill="url(#bGreen)" />
  <circle cx="640" cy="125" r="32" fill="url(#bRed)" />

  <!-- Row 2 -->
  <circle cx="224" cy="180" r="32" fill="url(#bPink)" />
  <circle cx="288" cy="180" r="32" fill="url(#bPink)" />
  <circle cx="352" cy="180" r="32" fill="url(#bPurple)" />
  <circle cx="416" cy="180" r="32" fill="url(#bBlue)" />
  <circle cx="480" cy="180" r="32" fill="url(#bYellow)" />
  <circle cx="544" cy="180" r="32" fill="url(#bRed)" />
  <circle cx="608" cy="180" r="32" fill="url(#bRed)" />

  <!-- Row 3 (cluster being targeted) -->
  <circle cx="256" cy="235" r="32" fill="url(#bPurple)" />
  <circle cx="320" cy="235" r="32" fill="url(#bPink)" />
  <circle cx="384" cy="235" r="32" fill="url(#bPink)" filter="url(#bubbleGlow)" />
  <circle cx="448" cy="235" r="32" fill="url(#bBlue)" />
  <circle cx="512" cy="235" r="32" fill="url(#bRed)" />

  <!-- Row 4 (lonely clusters) -->
  <circle cx="352" cy="290" r="32" fill="url(#bPink)" />
  <circle cx="416" cy="290" r="32" fill="url(#bPurple)" />

  <!-- Popping Pop Effect Sparkles around row 3 cluster -->
  <g stroke="#fbcfe8" stroke-width="2.5" opacity="0.8">
    <line x1="384" y1="200" x2="384" y2="185" />
    <line x1="410" y1="210" x2="422" y2="200" />
    <line x1="420" y1="235" x2="435" y2="235" />
    <line x1="410" y1="260" x2="425" y2="270" />
    <line x1="360" y1="210" x2="348" y2="200" />
    <line x1="350" y1="235" x2="335" y2="235" />
  </g>

  <!-- Aiming Line with Dotted Trajectory -->
  <line x1="400" y1="490" x2="365" y2="330" stroke="#f472b6" stroke-width="4" stroke-dasharray="8 8" opacity="0.8" filter="url(#bubbleGlow)" />

  <!-- Flying Projectile Bubble -->
  <circle cx="376" cy="380" r="32" fill="url(#bPink)" filter="url(#bubbleGlow)" />
  <!-- Speed trail -->
  <path d="M 376 412 L 388 440 L 364 440 Z" fill="#ec4899" opacity="0.4" />

  <!-- Cannon Base / Shooter Arena -->
  <g transform="translate(400, 520)">
    <!-- Base pedestal -->
    <path d="M -90 60 C -90 10, -50 0, 0 0 C 50 0, 90 10, 90 60 Z" fill="#1e1035" stroke="#ec4899" stroke-width="3" />
    <!-- Rotating pointer ring -->
    <circle cx="0" cy="0" r="50" fill="#2b104b" stroke="#a855f7" stroke-width="3" />
    <circle cx="0" cy="0" r="38" fill="#130626" />

    <!-- Loaded Ammo Bubble -->
    <circle cx="0" cy="-5" r="30" fill="url(#bPurple)" filter="url(#bubbleGlow)" />

    <!-- Next preview bubble -->
    <g transform="translate(-110, 30)">
      <circle cx="0" cy="0" r="20" fill="url(#bBlue)" opacity="0.85" />
      <text x="0" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#bae6fd" text-anchor="middle">NEXT</text>
    </g>
  </g>

  <!-- Title Badge Overlay -->
  <rect x="210" y="30" width="380" height="60" rx="16" fill="rgba(46, 8, 84, 0.85)" stroke="#ec4899" stroke-width="2" filter="url(#bubbleGlow)" />
  <text x="400" y="72" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    BUBBLE SHOOTER
  </text>
</svg>
