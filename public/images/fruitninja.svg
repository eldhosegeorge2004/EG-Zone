<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0c1b" />
      <stop offset="50%" stop-color="#3b112c" />
      <stop offset="100%" stop-color="#1a0916" />
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="melonSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="melonFlesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="orangeSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Radial highlight -->
  <circle cx="400" cy="300" r="350" fill="#f43f5e" opacity="0.12" filter="url(#glow)"/>

  <!-- Fruit Splatters -->
  <g fill="#ef4444" opacity="0.6">
    <circle cx="280" cy="220" r="16" />
    <circle cx="250" cy="240" r="8" />
    <circle cx="310" cy="210" r="10" />
    <circle cx="295" cy="260" r="12" />
    <circle cx="560" cy="340" r="14" />
    <circle cx="580" cy="380" r="8" />
  </g>
  <g fill="#f97316" opacity="0.5">
    <circle cx="510" cy="210" r="10" />
    <circle cx="535" cy="190" r="6" />
    <circle cx="490" cy="235" r="8" />
  </g>

  <!-- Sliced Watermelon Half 1 (Left, flying upward) -->
  <g transform="translate(310, 260) rotate(-28)">
    <path d="M-80,0 A80,80 0 0,0 80,0 Z" fill="url(#melonSkin)" />
    <path d="M-72,0 A72,72 0 0,0 72,0 Z" fill="#ffffff" />
    <path d="M-66,0 A66,66 0 0,0 66,0 Z" fill="url(#melonFlesh)" />
    <!-- Seeds -->
    <ellipse cx="-35" cy="25" rx="3" ry="6" fill="#1c1917" transform="rotate(-30 -35 25)"/>
    <ellipse cx="0" cy="35" rx="3" ry="6" fill="#1c1917" />
    <ellipse cx="35" cy="25" rx="3" ry="6" fill="#1c1917" transform="rotate(30 35 25)"/>
  </g>

  <!-- Sliced Watermelon Half 2 (Right, falling downward) -->
  <g transform="translate(470, 360) rotate(32)">
    <path d="M-80,0 A80,80 0 0,1 80,0 Z" fill="url(#melonSkin)" />
    <path d="M-72,0 A72,72 0 0,1 72,0 Z" fill="#ffffff" />
    <path d="M-66,0 A66,66 0 0,1 66,0 Z" fill="url(#melonFlesh)" />
    <!-- Seeds -->
    <ellipse cx="-35" cy="-25" rx="3" ry="6" fill="#1c1917" transform="rotate(30 -35 -25)"/>
    <ellipse cx="0" cy="-35" rx="3" ry="6" fill="#1c1917" />
    <ellipse cx="35" cy="-25" rx="3" ry="6" fill="#1c1917" transform="rotate(-30 35 -25)"/>
  </g>

  <!-- Orange (Top Right) -->
  <g transform="translate(560, 180)">
    <circle cx="0" cy="0" r="48" fill="url(#orangeSkin)"/>
    <circle cx="-14" cy="-14" r="12" fill="#fed7aa" opacity="0.4"/>
    <!-- Leaf -->
    <path d="M-4,-48 Q-25,-75 0,-85 Q5,-65 -4,-48 Z" fill="#22c55e"/>
  </g>

  <!-- Apple (Bottom Left) -->
  <g transform="translate(210, 410) rotate(-15)">
    <circle cx="-16" cy="0" r="38" fill="#dc2626"/>
    <circle cx="16" cy="0" r="38" fill="#ef4444"/>
    <ellipse cx="14" cy="-12" rx="10" ry="18" fill="#fca5a5" opacity="0.4" transform="rotate(25 14 -12)"/>
    <!-- Stem -->
    <path d="M0,-36 Q6,-55 18,-58" stroke="#78350f" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Dramatic Blade Slash Trail -->
  <path d="M120,490 Q390,280 690,130" stroke="url(#blade)" stroke-width="12" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <path d="M140,480 Q395,282 680,135" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Blade Sparkles -->
  <polygon points="410,265 415,278 428,283 415,288 410,301 405,288 392,283 405,278" fill="#ffffff" filter="url(#glow)"/>
  <polygon points="340,315 343,323 351,326 343,329 340,337 337,329 329,326 337,323" fill="#ffffff" filter="url(#glow)"/>
  <polygon points="480,225 483,233 491,236 483,239 480,247 477,239 469,236 477,233" fill="#ffffff" filter="url(#glow)"/>

  <!-- Title Badge -->
  <g transform="translate(400, 520)">
    <rect x="-220" y="-35" width="440" height="70" rx="35" fill="rgba(15, 23, 42, 0.85)" stroke="#f43f5e" stroke-width="3" filter="url(#glow)"/>
    <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="3">
      FRUIT NINJA
    </text>
  </g>
</svg>
