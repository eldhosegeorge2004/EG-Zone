<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="dinoBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#052e16" />
      <stop offset="60%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="dinoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="cactusGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="dinoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#dinoBg)" />

  <!-- Stars / Dust particles -->
  <circle cx="120" cy="80" r="2" fill="#86efac" opacity="0.6" />
  <circle cx="280" cy="60" r="1.5" fill="#86efac" opacity="0.4" />
  <circle cx="450" cy="110" r="2.5" fill="#86efac" opacity="0.5" />
  <circle cx="680" cy="70" r="2" fill="#86efac" opacity="0.6" />
  <circle cx="740" cy="140" r="1.5" fill="#86efac" opacity="0.4" />
  <circle cx="80" cy="160" r="2" fill="#86efac" opacity="0.5" />

  <!-- Prehistoric Desert Sun / Moon -->
  <circle cx="620" cy="160" r="70" fill="url(#sunGrad)" opacity="0.85" filter="url(#dinoGlow)" />
  <circle cx="620" cy="160" r="58" fill="#fef9c3" opacity="0.9" />

  <!-- Clouds -->
  <path d="M 140 180 q 20 -25 45 -5 q 30 -30 65 0 q 30 5 25 30 l -140 0 z" fill="#1e3a2b" opacity="0.5" />
  <path d="M 420 130 q 15 -20 35 -5 q 25 -25 50 0 q 25 5 20 25 l -110 0 z" fill="#1e3a2b" opacity="0.4" />

  <!-- Distant Dunes -->
  <path d="M 0 440 Q 200 360 450 430 T 800 400 L 800 600 L 0 600 Z" fill="#064e3b" opacity="0.7" />
  <path d="M 0 460 Q 300 400 550 470 T 800 440 L 800 600 L 0 600 Z" fill="#043d2e" />

  <!-- Ground Layer -->
  <rect x="0" y="470" width="800" height="130" fill="url(#groundGrad)" />
  <line x1="0" y1="470" x2="800" y2="470" stroke="#4ade80" stroke-width="4" filter="url(#dinoGlow)" />

  <!-- Ground Texture Lines -->
  <line x1="40" y1="485" x2="90" y2="485" stroke="#86efac" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <line x1="160" y1="510" x2="230" y2="510" stroke="#86efac" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  <line x1="320" y1="490" x2="380" y2="490" stroke="#86efac" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <line x1="480" y1="520" x2="560" y2="520" stroke="#86efac" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  <line x1="640" y1="495" x2="710" y2="495" stroke="#86efac" stroke-width="3" stroke-linecap="round" opacity="0.7" />

  <!-- Cacti Obstacles -->
  <g fill="url(#cactusGrad)">
    <!-- Cactus 1 -->
    <rect x="490" y="380" width="22" height="90" rx="6" />
    <path d="M 475 410 h 15 v 25 h -15 z" />
    <path d="M 475 400 v 25 h 10 v -25 z" />
    <path d="M 512 420 h 15 v 25 h -15 z" />
    <path d="M 517 410 v 25 h 10 v -25 z" />

    <!-- Cactus 2 (small) -->
    <rect x="540" y="415" width="16" height="55" rx="5" />
    <path d="M 556 430 h 12 v 18 h -12 z" />
    <path d="M 560 422 v 18 h 8 v -18 z" />
  </g>

  <!-- Pterodactyl flying -->
  <g fill="#a7f3d0" opacity="0.9" filter="url(#dinoGlow)">
    <path d="M 360 260 q 20 -15 50 -8 l -15 25 l -15 -10 l -20 15 z" />
    <path d="M 390 270 l 25 -5 l -10 10 z" />
    <ellipse cx="385" cy="272" rx="14" ry="7" />
  </g>

  <!-- The Dinosaur (Jumping) -->
  <g transform="translate(180, 290)">
    <!-- Motion Trails -->
    <path d="M -30 90 L 10 90" stroke="#4ade80" stroke-width="4" stroke-linecap="round" opacity="0.4" />
    <path d="M -45 110 L -5 110" stroke="#4ade80" stroke-width="4" stroke-linecap="round" opacity="0.3" />
    <path d="M -20 130 L 20 130" stroke="#4ade80" stroke-width="4" stroke-linecap="round" opacity="0.5" />

    <!-- Dino Body -->
    <rect x="20" y="40" width="70" height="80" rx="14" fill="url(#dinoGrad)" filter="url(#dinoGlow)" />
    <!-- Dino Head -->
    <rect x="50" y="10" width="65" height="45" rx="10" fill="url(#dinoGrad)" filter="url(#dinoGlow)" />
    <!-- Snout / Jaws -->
    <rect x="90" y="24" width="35" height="26" rx="6" fill="url(#dinoGrad)" />
    <!-- Eye -->
    <circle cx="85" cy="26" r="7" fill="#ffffff" />
    <circle cx="88" cy="26" r="3.5" fill="#022c22" />
    <!-- Teeth -->
    <polygon points="105,48 110,42 115,48" fill="#ffffff" />
    <!-- Back Spikes -->
    <polygon points="20,50 10,60 20,70" fill="#22c55e" />
    <polygon points="20,75 8,88 20,100" fill="#22c55e" />
    <!-- Tail -->
    <path d="M 20 85 Q -25 95 -40 70 Q -25 115 20 115 Z" fill="url(#dinoGrad)" />
    <!-- Arm -->
    <rect x="75" y="65" width="22" height="10" rx="5" fill="#22c55e" />
    <rect x="90" y="70" width="8" height="12" rx="4" fill="#22c55e" />
    <!-- Jumping Legs -->
    <rect x="35" y="115" width="16" height="35" rx="7" transform="rotate(25 35 115)" fill="url(#dinoGrad)" />
    <rect x="60" y="115" width="16" height="35" rx="7" transform="rotate(-15 60 115)" fill="url(#dinoGrad)" />
  </g>

  <!-- Title Badge Overlay -->
  <rect x="230" y="40" width="340" height="64" rx="16" fill="rgba(6, 78, 59, 0.85)" stroke="#4ade80" stroke-width="2" filter="url(#dinoGlow)" />
  <text x="400" y="83" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    DINO JUMP
  </text>
</svg>
