<svg xmlns="http://www.w3.org/2000/svg" viewBox="-133.5 0 1067 600" width="800" height="600">
  <defs>
    <!-- Sky & Grass -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fd6ff"/>
      <stop offset="65%" stop-color="#c8f0ff"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9be564"/>
      <stop offset="100%" stop-color="#5cbf3a"/>
    </linearGradient>

    <!-- Brown Classic Mole -->
    <radialGradient id="brownMole" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#a0673f"/>
      <stop offset="100%" stop-color="#7a4a28"/>
    </radialGradient>

    <!-- Golden Mole -->
    <radialGradient id="goldMole" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#ffd43b"/>
      <stop offset="100%" stop-color="#f59f00"/>
    </radialGradient>

    <!-- Ice Mole -->
    <radialGradient id="iceMole" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#8fd8ff"/>
      <stop offset="100%" stop-color="#3a9bd9"/>
    </radialGradient>

    <!-- Dirt Hole Gradients -->
    <radialGradient id="holeDepth" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#140a04"/>
      <stop offset="100%" stop-color="#38210f"/>
    </radialGradient>

    <!-- Gold Badge Gradient -->
    <linearGradient id="goldBadge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd43b"/>
      <stop offset="100%" stop-color="#f59f00"/>
    </linearGradient>
    <linearGradient id="iceBadge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#74c0fc"/>
      <stop offset="100%" stop-color="#1c7ed6"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect x="-200" width="1267" height="380" fill="url(#skyGrad)"/>

  <!-- Clouds -->
  <g opacity="0.92">
    <ellipse cx="140" cy="80" rx="75" ry="24" fill="white"/>
    <ellipse cx="115" cy="62" rx="32" ry="32" fill="white"/>
    <ellipse cx="165" cy="68" rx="24" ry="24" fill="white"/>
  </g>
  <g opacity="0.85">
    <ellipse cx="640" cy="70" rx="65" ry="22" fill="white"/>
    <ellipse cx="618" cy="54" rx="28" ry="28" fill="white"/>
    <ellipse cx="662" cy="58" rx="22" ry="22" fill="white"/>
  </g>
  <g opacity="0.75">
    <ellipse cx="390" cy="110" rx="55" ry="18" fill="white"/>
    <ellipse cx="372" cy="98" rx="24" ry="24" fill="white"/>
    <ellipse cx="414" cy="102" rx="18" ry="18" fill="white"/>
  </g>

  <!-- Title & Floating Badges -->
  <g>
    <!-- Floating Sparkles -->
    <text x="210" y="85" font-size="28" fill="#ffd43b" opacity="0.9">✨</text>
    <text x="570" y="85" font-size="28" fill="#ffd43b" opacity="0.9">✨</text>
    <text x="130" y="160" font-size="20" fill="#74c0fc">❄️</text>
    <text x="660" y="150" font-size="24" fill="#ffd43b">⭐</text>

    <!-- Score Badges -->
    <!-- +5 Gold -->
    <g transform="translate(480, 150)">
      <rect x="-10" y="-12" width="80" height="38" rx="19" fill="url(#goldBadge)" stroke="#8f6a00" stroke-width="2.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.25))"/>
      <text x="30" y="15" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-size="22" font-weight="900" fill="#5c3b00">+5 👑</text>
    </g>
    <!-- +1 Classic -->
    <g transform="translate(620, 240)">
      <rect x="-5" y="-10" width="70" height="34" rx="17" fill="#69db7c" stroke="#1b6e2e" stroke-width="2.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.25))"/>
      <text x="30" y="14" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-size="20" font-weight="900" fill="#fff">+1 🐹</text>
    </g>
    <!-- Freeze Badge -->
    <g transform="translate(100, 240)">
      <rect x="-10" y="-10" width="105" height="34" rx="17" fill="url(#iceBadge)" stroke="#0b4a8a" stroke-width="2.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.25))"/>
      <text x="42" y="14" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-size="16" font-weight="900" fill="#fff">❄️ FREEZE</text>
    </g>

    <!-- Main Game Title -->
    <text x="400" y="155" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="64" font-weight="900"
          fill="#ffe066" stroke="#8a4b08" stroke-width="5" paint-order="stroke fill"
          letter-spacing="3" filter="drop-shadow(0 6px 0 #5e3716)">MOLE MASH</text>
    <text x="400" y="195" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" font-size="22" font-weight="800"
          fill="#fff" stroke="#5a3414" stroke-width="3" paint-order="stroke fill"
          letter-spacing="1">TAP · COMBO · SURVIVE!</text>
  </g>

  <!-- Grass Ground -->
  <rect x="-200" y="360" width="1267" height="240" fill="url(#grassGrad)"/>
  <!-- Grass edge trim -->
  <path d="M-200 360 Q 200 350 400 360 T 1067 360 L 1067 375 L -200 375 Z" fill="#8be04e"/>

  <!-- ============================================================== -->
  <!-- HOLE 1 (LEFT): ICE MOLE ❄️ -->
  <!-- ============================================================== -->
  <g transform="translate(170, 390)">
    <!-- Hole back -->
    <ellipse cx="0" cy="30" rx="75" ry="26" fill="url(#holeDepth)"/>

    <!-- Ice Mole Body -->
    <g transform="translate(0, 0)">
      <!-- Snowflake crown/badge -->
      <text x="0" y="-45" font-size="34" text-anchor="middle">❄️</text>

      <!-- Ears -->
      <circle cx="-32" cy="-18" r="13" fill="#3a9bd9"/>
      <circle cx="32" cy="-18" r="13" fill="#3a9bd9"/>
      <circle cx="-32" cy="-18" r="7" fill="#ff8fb0" opacity="0.8"/>
      <circle cx="32" cy="-18" r="7" fill="#ff8fb0" opacity="0.8"/>

      <!-- Body & Belly -->
      <ellipse cx="0" cy="18" rx="46" ry="48" fill="url(#iceMole)" stroke="#3a9bd9" stroke-width="2.5"/>
      <ellipse cx="0" cy="36" rx="26" ry="24" fill="#e7f7ff"/>

      <!-- Cheeks -->
      <circle cx="-28" cy="20" r="7" fill="#ff8fb0" opacity="0.6"/>
      <circle cx="28" cy="20" r="7" fill="#ff8fb0" opacity="0.6"/>

      <!-- Eyes (happy wide) -->
      <circle cx="-16" cy="6" r="10" fill="#fff"/>
      <circle cx="16" cy="6" r="10" fill="#fff"/>
      <circle cx="-14" cy="8" r="6" fill="#143c5a"/>
      <circle cx="14" cy="8" r="6" fill="#143c5a"/>
      <circle cx="-12" cy="5" r="2.5" fill="#fff"/>
      <circle cx="16" cy="5" r="2.5" fill="#fff"/>

      <!-- Nose & Smile -->
      <ellipse cx="0" cy="20" rx="11" ry="8" fill="#ff8fb0"/>
      <ellipse cx="-3" cy="18" rx="3.5" ry="2" fill="#fff" opacity="0.6"/>
      <path d="M -9 30 Q 0 40 9 30" fill="#fff" stroke="#143c5a" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="-3.5" y="30" width="3.5" height="6" rx="1.5" fill="#fff" stroke="#143c5a" stroke-width="1.5"/>
      <rect x="0" y="30" width="3.5" height="6" rx="1.5" fill="#fff" stroke="#143c5a" stroke-width="1.5"/>

      <!-- Paws resting on rim -->
      <ellipse cx="-35" cy="45" rx="12" ry="7" fill="#3a9bd9" stroke="#143c5a" stroke-width="2"/>
      <ellipse cx="35" cy="45" rx="12" ry="7" fill="#3a9bd9" stroke="#143c5a" stroke-width="2"/>
    </g>

    <!-- Hole front mound -->
    <ellipse cx="0" cy="50" rx="85" ry="22" fill="#7a4a22"/>
    <ellipse cx="0" cy="48" rx="82" ry="20" fill="#5a3414"/>
    <path d="M -80 48 Q 0 35 80 48 Q 60 70 -60 70 Z" fill="#6bbf3a" opacity="0.3"/>
  </g>

  <!-- ============================================================== -->
  <!-- HOLE 2 (CENTER - PROMINENT): GOLDEN MOLE 👑 -->
  <!-- ============================================================== -->
  <g transform="translate(400, 420)">
    <!-- Hole back -->
    <ellipse cx="0" cy="35" rx="95" ry="32" fill="url(#holeDepth)"/>

    <!-- Golden Mole Body -->
    <g transform="translate(0, -10)">
      <!-- Golden Crown -->
      <path d="M -30 -30 L -20 -55 L -6 -38 L 0 -58 L 6 -38 L 20 -55 L 30 -30 Z" fill="#fff3bf" stroke="#c77700" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="-20" cy="-55" r="3.5" fill="#ff6b6b"/>
      <circle cx="0" cy="-58" r="4.5" fill="#ff6b6b"/>
      <circle cx="20" cy="-55" r="3.5" fill="#ff6b6b"/>

      <!-- Ears -->
      <circle cx="-38" cy="-8" r="15" fill="#f59f00"/>
      <circle cx="38" cy="-8" r="15" fill="#f59f00"/>
      <circle cx="-38" cy="-8" r="8" fill="#ff8787" opacity="0.8"/>
      <circle cx="38" cy="-8" r="8" fill="#ff8787" opacity="0.8"/>

      <!-- Body & Belly -->
      <ellipse cx="0" cy="30" rx="56" ry="58" fill="url(#goldMole)" stroke="#c77700" stroke-width="3"/>
      <ellipse cx="0" cy="52" rx="32" ry="28" fill="#fff3bf"/>

      <!-- Blushing Cheeks -->
      <circle cx="-35" cy="34" r="9" fill="#ff8787" opacity="0.6"/>
      <circle cx="35" cy="34" r="9" fill="#ff8787" opacity="0.6"/>

      <!-- Joyful Eyes -->
      <circle cx="-20" cy="18" r="12" fill="#fff"/>
      <circle cx="20" cy="18" r="12" fill="#fff"/>
      <circle cx="-17" cy="20" r="7" fill="#5c3b00"/>
      <circle cx="17" cy="20" r="7" fill="#5c3b00"/>
      <circle cx="-14" cy="16" r="3" fill="#fff"/>
      <circle cx="20" cy="16" r="3" fill="#fff"/>

      <!-- Nose & Big Smile -->
      <ellipse cx="0" cy="34" rx="14" ry="10" fill="#ff8787"/>
      <ellipse cx="-4" cy="31" rx="4" ry="2.5" fill="#fff" opacity="0.6"/>
      <path d="M -12 46 Q 0 60 12 46" fill="#fff" stroke="#5c3b00" stroke-width="3" stroke-linejoin="round"/>
      <rect x="-4.5" y="46" width="4.5" height="8" rx="2" fill="#fff" stroke="#5c3b00" stroke-width="2"/>
      <rect x="0" y="46" width="4.5" height="8" rx="2" fill="#fff" stroke="#5c3b00" stroke-width="2"/>

      <!-- Happy Waving Paws -->
      <ellipse cx="-45" cy="58" rx="15" ry="9" fill="#f59f00" stroke="#8f6a00" stroke-width="2.5"/>
      <ellipse cx="45" cy="58" rx="15" ry="9" fill="#f59f00" stroke="#8f6a00" stroke-width="2.5"/>
    </g>

    <!-- Hole front mound -->
    <ellipse cx="0" cy="62" rx="108" ry="28" fill="#7a4a22"/>
    <ellipse cx="0" cy="60" rx="104" ry="25" fill="#5a3414"/>
    <path d="M -100 58 Q 0 42 100 58 Q 75 85 -75 85 Z" fill="#6bbf3a" opacity="0.35"/>
  </g>

  <!-- ============================================================== -->
  <!-- HOLE 3 (RIGHT): CLASSIC MOLE 🐹 -->
  <!-- ============================================================== -->
  <g transform="translate(630, 390)">
    <!-- Hole back -->
    <ellipse cx="0" cy="30" rx="75" ry="26" fill="url(#holeDepth)"/>

    <!-- Brown Mole Body -->
    <g transform="translate(0, 0)">
      <!-- Ears -->
      <circle cx="-32" cy="-18" r="13" fill="#7a4a28"/>
      <circle cx="32" cy="-18" r="13" fill="#7a4a28"/>
      <circle cx="-32" cy="-18" r="7" fill="#ff7b9c" opacity="0.8"/>
      <circle cx="32" cy="-18" r="7" fill="#ff7b9c" opacity="0.8"/>

      <!-- Body & Belly -->
      <ellipse cx="0" cy="18" rx="46" ry="48" fill="url(#brownMole)" stroke="#5e3716" stroke-width="2.5"/>
      <ellipse cx="0" cy="36" rx="26" ry="24" fill="#e8c9a0"/>

      <!-- Cheeks -->
      <circle cx="-28" cy="20" r="7" fill="#ff7b9c" opacity="0.55"/>
      <circle cx="28" cy="20" r="7" fill="#ff7b9c" opacity="0.55"/>

      <!-- Cute Eyes -->
      <circle cx="-16" cy="6" r="10" fill="#fff"/>
      <circle cx="16" cy="6" r="10" fill="#fff"/>
      <circle cx="-14" cy="8" r="6" fill="#2b1405"/>
      <circle cx="14" cy="8" r="6" fill="#2b1405"/>
      <circle cx="-12" cy="5" r="2.5" fill="#fff"/>
      <circle cx="16" cy="5" r="2.5" fill="#fff"/>

      <!-- Whiskers -->
      <path d="M -30 22 L -45 18 M -30 26 L -46 27 M 30 22 L 45 18 M 30 26 L 46 27" stroke="#e8c9a0" stroke-width="2" stroke-linecap="round"/>

      <!-- Nose & Smile -->
      <ellipse cx="0" cy="20" rx="11" ry="8" fill="#ff7b9c"/>
      <ellipse cx="-3" cy="18" rx="3.5" ry="2" fill="#fff" opacity="0.6"/>
      <path d="M -9 30 Q 0 40 9 30" fill="#fff" stroke="#2b1405" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="-3.5" y="30" width="3.5" height="6" rx="1.5" fill="#fff" stroke="#2b1405" stroke-width="1.5"/>
      <rect x="0" y="30" width="3.5" height="6" rx="1.5" fill="#fff" stroke="#2b1405" stroke-width="1.5"/>

      <!-- Paws -->
      <ellipse cx="-35" cy="45" rx="12" ry="7" fill="#7a4a28" stroke="#3a2210" stroke-width="2"/>
      <ellipse cx="35" cy="45" rx="12" ry="7" fill="#7a4a28" stroke="#3a2210" stroke-width="2"/>
    </g>

    <!-- Hole front mound -->
    <ellipse cx="0" cy="50" rx="85" ry="22" fill="#7a4a22"/>
    <ellipse cx="0" cy="48" rx="82" ry="20" fill="#5a3414"/>
    <path d="M -80 48 Q 0 35 80 48 Q 60 70 -60 70 Z" fill="#6bbf3a" opacity="0.3"/>
  </g>
</svg>
