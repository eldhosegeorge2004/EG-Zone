<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="aeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="gridBoard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#aeBg)" />

  <!-- Center Puzzle Grid Frame -->
  <rect x="220" y="80" width="360" height="360" rx="24" fill="url(#gridBoard)" stroke="#334155" stroke-width="4" filter="url(#glow)" />

  <!-- Grid Points Pattern -->
  <g fill="#475569" opacity="0.4">
    <circle cx="280" cy="140" r="3" /><circle cx="340" cy="140" r="3" /><circle cx="400" cy="140" r="3" /><circle cx="460" cy="140" r="3" /><circle cx="520" cy="140" r="3" />
    <circle cx="280" cy="200" r="3" /><circle cx="340" cy="200" r="3" /><circle cx="400" cy="200" r="3" /><circle cx="460" cy="200" r="3" /><circle cx="520" cy="200" r="3" />
    <circle cx="280" cy="260" r="3" /><circle cx="340" cy="260" r="3" /><circle cx="400" cy="260" r="3" /><circle cx="460" cy="260" r="3" /><circle cx="520" cy="260" r="3" />
    <circle cx="280" cy="320" r="3" /><circle cx="340" cy="320" r="3" /><circle cx="400" cy="320" r="3" /><circle cx="460" cy="320" r="3" /><circle cx="520" cy="320" r="3" />
    <circle cx="280" cy="380" r="3" /><circle cx="340" cy="380" r="3" /><circle cx="400" cy="380" r="3" /><circle cx="460" cy="380" r="3" /><circle cx="520" cy="380" r="3" />
  </g>

  <!-- Stylized Arrows on Grid -->
  <!-- Arrow 1: Pointing Right (Cyan) escaping -->
  <g filter="url(#glow)">
    <line x1="280" y1="140" x2="480" y2="140" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" />
    <polygon points="505,140 470,124 470,156" fill="url(#cyanGrad)" />
  </g>

  <!-- Arrow 2: Pointing Down (Emerald) -->
  <g filter="url(#glow)">
    <line x1="340" y1="200" x2="340" y2="350" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" />
    <polygon points="340,375 324,340 356,340" fill="url(#emeraldGrad)" />
  </g>

  <!-- Arrow 3: Pointing Up (Amber) -->
  <g filter="url(#glow)">
    <line x1="460" y1="380" x2="460" y2="230" stroke="url(#amberGrad)" stroke-width="12" stroke-linecap="round" />
    <polygon points="460,205 444,240 476,240" fill="url(#amberGrad)" />
  </g>

  <!-- Arrow 4: Pointing Left (Rose) -->
  <g filter="url(#glow)">
    <line x1="520" y1="320" x2="380" y2="320" stroke="url(#roseGrad)" stroke-width="12" stroke-linecap="round" />
    <polygon points="355,320 390,304 390,336" fill="url(#roseGrad)" />
  </g>

  <!-- Arrow 5: Serpentine turn (Purple) -->
  <g filter="url(#glow)">
    <path d="M 280 260 L 400 260 L 400 180" fill="none" stroke="url(#purpleGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="400,155 384,190 416,190" fill="url(#purpleGrad)" />
  </g>

  <!-- Escape Dash Vector Line outside board -->
  <line x1="505" y1="140" x2="680" y2="140" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 8" opacity="0.6" />
  <circle cx="680" cy="140" r="5" fill="#38bdf8" opacity="0.8" />

  <!-- Badge / Title Section -->
  <g transform="translate(400, 500)">
    <!-- Badge Background -->
    <rect x="-170" y="-30" width="340" height="60" rx="30" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="2">ARROW ESCAPE</text>
  </g>
  <text x="400" y="555" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#94a3b8" text-anchor="middle" letter-spacing="3">10 LEVELS · LOGIC GRID PUZZLE</text>
</svg>
