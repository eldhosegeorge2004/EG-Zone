<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="stackBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Platform Gradients -->
    <linearGradient id="pCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="pBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="pIndigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="pPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="pPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="pOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="pYellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="pGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <filter id="stackGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#stackBg)" />

  <!-- Geometric Grid Backing -->
  <g stroke="rgba(34, 211, 238, 0.08)" stroke-width="1.5">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" stroke="rgba(34, 211, 238, 0.15)" stroke-dasharray="6 6" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />

    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="480" x2="800" y2="480" />
  </g>

  <!-- Ambient Tower Glow Behind -->
  <ellipse cx="400" cy="380" rx="200" ry="180" fill="#0284c7" opacity="0.15" filter="url(#stackGlow)" />

  <!-- The Stack Tower Layers -->
  <!-- Base Tier 1 (Lowest) -->
  <g transform="translate(0, 0)">
    <!-- Shadow -->
    <rect x="230" y="525" width="340" height="38" rx="8" fill="rgba(0,0,0,0.4)" />
    <!-- Block -->
    <rect x="230" y="515" width="340" height="38" rx="8" fill="url(#pBlue)" />
    <rect x="235" y="518" width="330" height="8" rx="4" fill="rgba(255,255,255,0.25)" />
  </g>

  <!-- Tier 2 -->
  <g>
    <rect x="245" y="475" width="310" height="38" rx="8" fill="rgba(0,0,0,0.3)" />
    <rect x="245" y="465" width="310" height="38" rx="8" fill="url(#pIndigo)" />
    <rect x="250" y="468" width="300" height="8" rx="4" fill="rgba(255,255,255,0.25)" />
  </g>

  <!-- Tier 3 -->
  <g>
    <rect x="260" y="425" width="280" height="38" rx="8" fill="rgba(0,0,0,0.3)" />
    <rect x="260" y="415" width="280" height="38" rx="8" fill="url(#pPurple)" />
    <rect x="265" y="418" width="270" height="8" rx="4" fill="rgba(255,255,255,0.25)" />
  </g>

  <!-- Tier 4 -->
  <g>
    <rect x="270" y="375" width="260" height="38" rx="8" fill="rgba(0,0,0,0.3)" />
    <rect x="270" y="365" width="260" height="38" rx="8" fill="url(#pPink)" />
    <rect x="275" y="368" width="250" height="8" rx="4" fill="rgba(255,255,255,0.25)" />
  </g>

  <!-- Tier 5 -->
  <g>
    <rect x="280" y="325" width="240" height="38" rx="8" fill="rgba(0,0,0,0.3)" />
    <rect x="280" y="315" width="240" height="38" rx="8" fill="url(#pOrange)" />
    <rect x="285" y="318" width="230" height="8" rx="4" fill="rgba(255,255,255,0.25)" />
  </g>

  <!-- Tier 6 -->
  <g>
    <rect x="290" y="275" width="220" height="38" rx="8" fill="rgba(0,0,0,0.3)" />
    <rect x="290" y="265" width="220" height="38" rx="8" fill="url(#pYellow)" />
    <rect x="295" y="268" width="210" height="8" rx="4" fill="rgba(255,255,255,0.3)" />
  </g>

  <!-- Tier 7 (Target platform) -->
  <g>
    <rect x="300" y="225" width="200" height="38" rx="8" fill="rgba(0,0,0,0.3)" />
    <rect x="300" y="215" width="200" height="38" rx="8" fill="url(#pGreen)" />
    <rect x="305" y="218" width="190" height="8" rx="4" fill="rgba(255,255,255,0.35)" />
  </g>

  <!-- Falling Overhang Piece (Sliced off) -->
  <g transform="translate(500, 230) rotate(18)">
    <rect x="0" y="0" width="45" height="38" rx="6" fill="#22c55e" opacity="0.8" />
    <!-- Slice spark lines -->
    <line x1="-10" y1="-10" x2="5" y2="20" stroke="#fef08a" stroke-width="2.5" />
    <line x1="-5" y1="30" x2="10" y2="45" stroke="#fef08a" stroke-width="2" />
  </g>

  <!-- Sliding Block at Top (Active mover) -->
  <g transform="translate(320, 155)">
    <!-- Motion trails behind sliding block -->
    <line x1="-60" y1="19" x2="-10" y2="19" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <line x1="-90" y1="10" x2="-30" y2="10" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4" />
    <line x1="-50" y1="28" x2="-15" y2="28" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5" />

    <!-- Shadow -->
    <rect x="0" y="10" width="200" height="38" rx="8" fill="rgba(0,0,0,0.3)" />
    <!-- Block -->
    <rect x="0" y="0" width="200" height="38" rx="8" fill="url(#pCyan)" filter="url(#stackGlow)" />
    <rect x="5" y="3" width="190" height="8" rx="4" fill="rgba(255,255,255,0.5)" />
  </g>

  <!-- Drop Alignment Guide Lines -->
  <line x1="300" y1="193" x2="300" y2="215" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 4" opacity="0.7" />
  <line x1="500" y1="193" x2="500" y2="215" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 4" opacity="0.7" />

  <!-- Perfect combo sparkles -->
  <circle cx="400" cy="195" r="3" fill="#ffffff" filter="url(#stackGlow)" />
  <circle cx="370" cy="205" r="2" fill="#67e8f9" />
  <circle cx="430" cy="205" r="2" fill="#67e8f9" />

  <!-- Title Badge Overlay -->
  <rect x="240" y="35" width="320" height="60" rx="16" fill="rgba(8, 47, 73, 0.9)" stroke="#06b6d4" stroke-width="2" filter="url(#stackGlow)" />
  <text x="400" y="77" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    STACK TOWER
  </text>
</svg>
