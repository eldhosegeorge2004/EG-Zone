<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b081d" />
      <stop offset="100%" stop-color="#210d41" />
    </linearGradient>
    <linearGradient id="fillGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Ambient Decorative Rings -->
  <circle cx="200" cy="180" r="260" fill="#7c3aed" opacity="0.12" />
  <circle cx="650" cy="400" r="280" fill="#d946ef" opacity="0.08" />

  <!-- Central Picross Board -->
  <g transform="translate(190, 110)">
    <!-- Base Shadow Card -->
    <rect x="-10" y="-10" width="440" height="430" rx="20" fill="#110d29" stroke="#3b1d64" stroke-width="3" filter="url(#purpleGlow)" />

    <!-- Column Clue Headers (5 columns: 2, 4, 4, 4, 2 for Heart pattern) -->
    <!-- Col 0: 2 -->
    <text x="115" y="60" font-family="monospace" font-size="20" font-weight="900" fill="#c084fc" text-anchor="middle">2</text>
    <!-- Col 1: 4 -->
    <text x="175" y="60" font-family="monospace" font-size="20" font-weight="900" fill="#c084fc" text-anchor="middle">4</text>
    <!-- Col 2: 4 -->
    <text x="235" y="60" font-family="monospace" font-size="20" font-weight="900" fill="#c084fc" text-anchor="middle">4</text>
    <!-- Col 3: 4 -->
    <text x="295" y="60" font-family="monospace" font-size="20" font-weight="900" fill="#c084fc" text-anchor="middle">4</text>
    <!-- Col 4: 2 -->
    <text x="355" y="60" font-family="monospace" font-size="20" font-weight="900" fill="#c084fc" text-anchor="middle">2</text>

    <!-- Row Clues (Rows: 1 1, 5, 5, 3, 1) -->
    <!-- Row 0: 1 1 -->
    <text x="65" y="118" font-family="monospace" font-size="18" font-weight="900" fill="#c084fc" text-anchor="end">1 1</text>
    <!-- Row 1: 5 -->
    <text x="65" y="178" font-family="monospace" font-size="18" font-weight="900" fill="#c084fc" text-anchor="end">5</text>
    <!-- Row 2: 5 -->
    <text x="65" y="238" font-family="monospace" font-size="18" font-weight="900" fill="#c084fc" text-anchor="end">5</text>
    <!-- Row 3: 3 -->
    <text x="65" y="298" font-family="monospace" font-size="18" font-weight="900" fill="#c084fc" text-anchor="end">3</text>
    <!-- Row 4: 1 -->
    <text x="65" y="358" font-family="monospace" font-size="18" font-weight="900" fill="#c084fc" text-anchor="end">1</text>

    <!-- Dividing Grid Lines -->
    <line x1="85" y1="80" x2="385" y2="80" stroke="#7e22ce" stroke-width="2" />
    <line x1="85" y1="80" x2="85" y2="380" stroke="#7e22ce" stroke-width="2" />

    <!-- 5x5 Nonogram Cells depicting Heart Picture -->
    <!-- Row 0: [X] [Fill] [X] [Fill] [X] -->
    <rect x="90" y="85" width="50" height="50" rx="6" fill="#1e153b" stroke="#3b1d64" stroke-width="1.5" />
    <text x="115" y="118" font-family="sans-serif" font-size="22" font-weight="900" fill="#ef4444" text-anchor="middle">✕</text>

    <rect x="150" y="85" width="50" height="50" rx="6" fill="url(#heartGrad)" stroke="#f472b6" stroke-width="2" filter="url(#purpleGlow)" />

    <rect x="210" y="85" width="50" height="50" rx="6" fill="#1e153b" stroke="#3b1d64" stroke-width="1.5" />
    <text x="235" y="118" font-family="sans-serif" font-size="22" font-weight="900" fill="#ef4444" text-anchor="middle">✕</text>

    <rect x="270" y="85" width="50" height="50" rx="6" fill="url(#heartGrad)" stroke="#f472b6" stroke-width="2" filter="url(#purpleGlow)" />

    <rect x="330" y="85" width="50" height="50" rx="6" fill="#1e153b" stroke="#3b1d64" stroke-width="1.5" />
    <text x="355" y="118" font-family="sans-serif" font-size="22" font-weight="900" fill="#ef4444" text-anchor="middle">✕</text>

    <!-- Row 1: [Fill] [Fill] [Fill] [Fill] [Fill] -->
    <rect x="90" y="145" width="50" height="50" rx="6" fill="url(#heartGrad)" stroke="#f472b6" stroke-width="2" />
    <rect x="150" y="145" width="50" height="50" rx="6" fill="url(#heartGrad)" stroke="#f472b6" stroke-width="2" />
    <rect x="210" y="145" width="50" height="50" rx="6" fill="url(#heartGrad)" stroke="#f472b6" stroke-width="2" />
    <rect x="270" y="145" width="50" height="50" rx="6" fill="url(#heartGrad)" stroke="#f472b6" stroke-width="2" />
    <rect x="330" y="145" width="50" height="50" rx="6" fill="url(#heartGrad)" stroke="#f472b6" stroke-width="2" />

    <!-- Row 2: [Fill] [Fill] [Fill] [Fill] [Fill] -->
    <rect x="90" y="205" width="50" height="50" rx="6" fill="url(#heartGrad)" stroke="#f472b6" stroke-width="2" />
    <rect x="150" y="205" width="50" height="50" rx="6" fill="url(#heartGrad)" stroke="#f472b6" stroke-width="2" />
    <rect x="210" y="205" width="50" height="50" rx="6" fill="url(#heartGrad)" stroke="#f472b6" stroke-width="2" />
    <rect x="270" y="205" width="50" height="50" rx="6" fill="url(#heartGrad)" stroke="#f472b6" stroke-width="2" />
    <rect x="330" y="205" width="50" height="50" rx="6" fill="url(#heartGrad)" stroke="#f472b6" stroke-width="2" />

    <!-- Row 3: [X] [Fill] [Fill] [Fill] [X] -->
    <rect x="90" y="265" width="50" height="50" rx="6" fill="#1e153b" stroke="#3b1d64" stroke-width="1.5" />
    <text x="115" y="298" font-family="sans-serif" font-size="22" font-weight="900" fill="#ef4444" text-anchor="middle">✕</text>

    <rect x="150" y="265" width="50" height="50" rx="6" fill="url(#heartGrad)" stroke="#f472b6" stroke-width="2" />
    <rect x="210" y="265" width="50" height="50" rx="6" fill="url(#heartGrad)" stroke="#f472b6" stroke-width="2" />
    <rect x="270" y="265" width="50" height="50" rx="6" fill="url(#heartGrad)" stroke="#f472b6" stroke-width="2" />

    <rect x="330" y="265" width="50" height="50" rx="6" fill="#1e153b" stroke="#3b1d64" stroke-width="1.5" />
    <text x="355" y="298" font-family="sans-serif" font-size="22" font-weight="900" fill="#ef4444" text-anchor="middle">✕</text>

    <!-- Row 4: [X] [X] [Fill] [X] [X] -->
    <rect x="90" y="325" width="50" height="50" rx="6" fill="#1e153b" stroke="#3b1d64" stroke-width="1.5" />
    <text x="115" y="358" font-family="sans-serif" font-size="22" font-weight="900" fill="#ef4444" text-anchor="middle">✕</text>

    <rect x="150" y="325" width="50" height="50" rx="6" fill="#1e153b" stroke="#3b1d64" stroke-width="1.5" />
    <text x="175" y="358" font-family="sans-serif" font-size="22" font-weight="900" fill="#ef4444" text-anchor="middle">✕</text>

    <rect x="210" y="325" width="50" height="50" rx="6" fill="url(#heartGrad)" stroke="#f472b6" stroke-width="2" />

    <rect x="270" y="325" width="50" height="50" rx="6" fill="#1e153b" stroke="#3b1d64" stroke-width="1.5" />
    <text x="295" y="358" font-family="sans-serif" font-size="22" font-weight="900" fill="#ef4444" text-anchor="middle">✕</text>

    <rect x="330" y="325" width="50" height="50" rx="6" fill="#1e153b" stroke="#3b1d64" stroke-width="1.5" />
    <text x="355" y="358" font-family="sans-serif" font-size="22" font-weight="900" fill="#ef4444" text-anchor="middle">✕</text>
  </g>

  <!-- Title Text -->
  <text x="400" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" text-anchor="middle" fill="#c084fc" letter-spacing="4" filter="url(#purpleGlow)">
    NONOGRAM
  </text>
  <text x="400" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#e879f9" letter-spacing="5">
    JAPANESE PICROSS LOGIC
  </text>
</svg>
