<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Bomb Body Radial -->
    <radialGradient id="bombBody" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Spark Gradient -->
    <radialGradient id="sparkGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filters -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGlow)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="140" fill="#38bdf8" opacity="0.15" filter="url(#glow)"/>
  <circle cx="600" cy="400" r="130" fill="#ef4444" opacity="0.2" filter="url(#glow)"/>

  <!-- Isometric / Angled Minesweeper Grid Platform -->
  <g transform="translate(180, 100)" filter="url(#shadow)">
    <!-- Base Tray Frame -->
    <rect width="440" height="340" rx="28" fill="#1e293b" stroke="#334155" stroke-width="4" />
    <rect x="15" y="15" width="410" height="60" rx="14" fill="#020617" />

    <!-- Digital Counters in Tray -->
    <!-- Mine Count Left -->
    <rect x="25" y="24" width="75" height="42" rx="8" fill="#000000" stroke="#7f1d1d" stroke-width="1.5"/>
    <text x="62" y="53" font-family="monospace" font-weight="900" font-size="24" fill="#ef4444" text-anchor="middle" letter-spacing="2">010</text>

    <!-- Smiley Face Center -->
    <rect x="195" y="23" width="50" height="44" rx="12" fill="#334155" stroke="#475569" stroke-width="2"/>
    <circle cx="220" cy="45" r="16" fill="#facc15"/>
    <!-- Sunglasses -->
    <rect x="209" y="38" width="10" height="7" rx="2" fill="#000000"/>
    <rect x="221" y="38" width="10" height="7" rx="2" fill="#000000"/>
    <line x1="219" y1="41" x2="221" y2="41" stroke="#000000" stroke-width="1.5"/>
    <path d="M213,48 Q220,53 227,48" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

    <!-- Timer Right -->
    <rect x="340" y="24" width="75" height="42" rx="8" fill="#000000" stroke="#78350f" stroke-width="1.5"/>
    <text x="377" y="53" font-family="monospace" font-weight="900" font-size="24" fill="#f59e0b" text-anchor="middle" letter-spacing="2">042</text>

    <!-- Sample 4x4 Tiles Grid -->
    <g transform="translate(45, 95)">
      <!-- Row 0 -->
      <rect x="0" y="0" width="80" height="50" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
      <text x="40" y="35" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#3b82f6" text-anchor="middle">1</text>

      <rect x="90" y="0" width="80" height="50" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
      <text x="130" y="35" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#10b981" text-anchor="middle">2</text>

      <rect x="180" y="0" width="80" height="50" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
      <text x="220" y="35" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#ef4444" text-anchor="middle">3</text>

      <rect x="270" y="0" width="80" height="50" rx="6" fill="#475569" stroke="#64748b" stroke-width="2"/>

      <!-- Row 1 -->
      <rect x="0" y="60" width="80" height="50" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>
      <text x="40" y="95" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#3b82f6" text-anchor="middle">1</text>

      <rect x="90" y="60" width="80" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

      <!-- Flagged Tile -->
      <rect x="180" y="60" width="80" height="50" rx="6" fill="#475569" stroke="#64748b" stroke-width="2"/>
      <path d="M215,75 L235,85 L215,95 Z" fill="#ef4444" filter="url(#glow)"/>
      <line x1="215" y1="72" x2="215" y2="100" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>

      <rect x="270" y="60" width="80" height="50" rx="6" fill="#475569" stroke="#64748b" stroke-width="2"/>

      <!-- Row 2 -->
      <rect x="0" y="120" width="80" height="50" rx="6" fill="#475569" stroke="#64748b" stroke-width="2"/>
      <rect x="90" y="120" width="80" height="50" rx="6" fill="#475569" stroke="#64748b" stroke-width="2"/>
      <rect x="180" y="120" width="80" height="50" rx="6" fill="#475569" stroke="#64748b" stroke-width="2"/>
      <rect x="270" y="120" width="80" height="50" rx="6" fill="#475569" stroke="#64748b" stroke-width="2"/>

      <!-- Row 3 -->
      <rect x="0" y="180" width="80" height="50" rx="6" fill="#475569" stroke="#64748b" stroke-width="2"/>
      <rect x="90" y="180" width="80" height="50" rx="6" fill="#475569" stroke="#64748b" stroke-width="2"/>
      <rect x="180" y="180" width="80" height="50" rx="6" fill="#475569" stroke="#64748b" stroke-width="2"/>
      <rect x="270" y="180" width="80" height="50" rx="6" fill="#475569" stroke="#64748b" stroke-width="2"/>
    </g>
  </g>

  <!-- Foreground Glossy 3D Naval Mine / Bomb with Fuse -->
  <g transform="translate(180, 410)" filter="url(#shadow)">
    <!-- Main Iron Sphere -->
    <circle cx="0" cy="0" r="75" fill="url(#bombBody)" stroke="#475569" stroke-width="4"/>
    
    <!-- Spikes radiating outward -->
    <rect x="-95" y="-8" width="20" height="16" rx="4" fill="#334155"/>
    <rect x="75" y="-8" width="20" height="16" rx="4" fill="#334155"/>
    <rect x="-8" y="-95" width="16" height="20" rx="4" fill="#334155"/>
    <rect x="-8" y="75" width="16" height="20" rx="4" fill="#334155"/>
    <rect x="-70" y="-70" width="18" height="18" rx="4" fill="#334155" transform="rotate(45, -61, -61)"/>
    <rect x="52" y="-70" width="18" height="18" rx="4" fill="#334155" transform="rotate(45, 61, -61)"/>
    <rect x="-70" y="52" width="18" height="18" rx="4" fill="#334155" transform="rotate(45, -61, 61)"/>
    <rect x="52" y="52" width="18" height="18" rx="4" fill="#334155" transform="rotate(45, 61, 61)"/>

    <!-- Specular Highlight -->
    <ellipse cx="-24" cy="-28" rx="20" ry="10" fill="#94a3b8" opacity="0.3" transform="rotate(-30, -24, -28)"/>

    <!-- Fuse on Top -->
    <path d="M-8,-75 Q-20,-115 15,-130" fill="none" stroke="#ca8a04" stroke-width="5" stroke-linecap="round"/>
    <!-- Glowing Spark Particle -->
    <circle cx="15" cy="-130" r="16" fill="url(#sparkGrad)" filter="url(#glow)"/>
    <circle cx="15" cy="-130" r="6" fill="#ffffff"/>
  </g>

  <!-- Bottom Badge: MINESWEEPER -->
  <g transform="translate(400, 530)">
    <rect x="-160" y="-24" width="320" height="48" rx="24" fill="#020617" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="3">
      MINESWEEPER
    </text>
  </g>
</svg>
