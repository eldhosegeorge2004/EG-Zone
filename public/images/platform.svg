<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#312e81" />
      <stop offset="75%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#c026d3" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="plat1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Distant Mountains -->
  <polygon points="0,480 160,340 320,480" fill="#1e1b4b" opacity="0.6"/>
  <polygon points="200,480 420,290 640,480" fill="#2e1065" opacity="0.5"/>
  <polygon points="500,480 660,350 800,480" fill="#1e1b4b" opacity="0.7"/>

  <!-- Sunset Horizon Glow -->
  <ellipse cx="400" cy="460" rx="350" ry="80" fill="#f59e0b" opacity="0.2" filter="url(#glow)"/>

  <!-- Lower Left Platform -->
  <g transform="translate(80, 390)">
    <rect x="0" y="0" width="180" height="24" rx="8" fill="url(#plat1)" filter="url(#glow)"/>
    <rect x="0" y="0" width="180" height="6" rx="3" fill="#ffffff" opacity="0.4"/>
    <!-- Dirt block underneath -->
    <path d="M10,24 L170,24 L150,55 L30,55 Z" fill="#7c2d12" opacity="0.8"/>
  </g>

  <!-- Mid Elevated Platform -->
  <g transform="translate(320, 270)">
    <rect x="0" y="0" width="200" height="24" rx="8" fill="url(#plat1)" filter="url(#glow)"/>
    <rect x="0" y="0" width="200" height="6" rx="3" fill="#ffffff" opacity="0.4"/>
    <path d="M12,24 L188,24 L168,52 L32,52 Z" fill="#7c2d12" opacity="0.8"/>
  </g>

  <!-- Right Platform -->
  <g transform="translate(560, 370)">
    <rect x="0" y="0" width="170" height="24" rx="8" fill="url(#plat1)" filter="url(#glow)"/>
    <rect x="0" y="0" width="170" height="6" rx="3" fill="#ffffff" opacity="0.4"/>
    <path d="M10,24 L160,24 L142,50 L28,50 Z" fill="#7c2d12" opacity="0.8"/>
  </g>

  <!-- Patrol Robot Enemy on Right Platform -->
  <g transform="translate(620, 320)">
    <!-- Body -->
    <rect x="0" y="8" width="38" height="34" rx="6" fill="#06b6d4" />
    <rect x="6" y="16" width="10" height="10" rx="2" fill="#0f172a" />
    <rect x="22" y="16" width="10" height="10" rx="2" fill="#0f172a" />
    <circle cx="11" cy="21" r="3" fill="#ef4444" />
    <circle cx="27" cy="21" r="3" fill="#ef4444" />
    <!-- Antenna -->
    <line x1="19" y1="8" x2="19" y2="0" stroke="#06b6d4" stroke-width="3"/>
    <circle cx="19" cy="0" r="4" fill="#ef4444"/>
    <!-- Wheels/Tracks -->
    <rect x="2" y="42" width="34" height="8" rx="4" fill="#334155" />
  </g>

  <!-- Floating Gold Coins -->
  <g transform="translate(360, 210)" filter="url(#glow)">
    <circle cx="0" cy="0" r="16" fill="url(#coinGrad)"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#b45309" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-weight="900" font-size="16" fill="#78350f" text-anchor="middle">$</text>
  </g>
  <g transform="translate(420, 190)" filter="url(#glow)">
    <circle cx="0" cy="0" r="18" fill="url(#coinGrad)"/>
    <circle cx="0" cy="0" r="13" fill="none" stroke="#b45309" stroke-width="2"/>
    <text x="0" y="6" font-family="sans-serif" font-weight="900" font-size="18" fill="#78350f" text-anchor="middle">$</text>
  </g>
  <g transform="translate(480, 210)" filter="url(#glow)">
    <circle cx="0" cy="0" r="16" fill="url(#coinGrad)"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#b45309" stroke-width="2"/>
    <text x="0" y="5" font-family="sans-serif" font-weight="900" font-size="16" fill="#78350f" text-anchor="middle">$</text>
  </g>

  <!-- Jump Arc Dust & Trail -->
  <path d="M220,380 Q290,200 370,190" stroke="#fde047" stroke-width="4" stroke-dasharray="8 6" fill="none" opacity="0.7"/>

  <!-- Jumping Hero Character -->
  <g transform="translate(260, 230) rotate(8)">
    <!-- Cape fluttering -->
    <path d="M-8,-10 L-32,5 L-22,-20 Z" fill="#ef4444" />
    <!-- Torso -->
    <rect x="-14" y="-12" width="28" height="34" rx="6" fill="url(#heroGrad)" />
    <!-- Head -->
    <circle cx="0" cy="-24" r="14" fill="#fed7aa" />
    <!-- Hair / Cap -->
    <path d="M-14,-26 Q0,-42 14,-26 L14,-22 L-14,-22 Z" fill="#f97316" />
    <rect x="0" y="-28" width="18" height="6" rx="2" fill="#ea580c" />
    <!-- Eye -->
    <circle cx="6" cy="-24" r="2.5" fill="#0f172a" />
    <!-- Legs (jumping pose) -->
    <path d="M-8,22 L-18,36" stroke="#4338ca" stroke-width="8" stroke-linecap="round"/>
    <path d="M6,22 L14,32" stroke="#4338ca" stroke-width="8" stroke-linecap="round"/>
    <!-- Feet / Boots -->
    <ellipse cx="-20" cy="38" rx="6" ry="4" fill="#7c2d12" />
    <ellipse cx="16" cy="34" rx="6" ry="4" fill="#7c2d12" />
    <!-- Fist -->
    <circle cx="16" cy="-4" r="6" fill="#fed7aa" />
  </g>

  <!-- Jump Sparkles -->
  <polygon points="215,350 218,358 226,361 218,364 215,372 212,364 204,361 212,358" fill="#fde047" filter="url(#glow)"/>
  <polygon points="240,330 242,336 248,338 242,340 240,346 238,340 232,338 238,336" fill="#fde047" filter="url(#glow)"/>

  <!-- Title Badge -->
  <g transform="translate(400, 525)">
    <rect x="-200" y="-34" width="400" height="68" rx="34" fill="rgba(15, 23, 42, 0.85)" stroke="#f59e0b" stroke-width="3" filter="url(#glow)"/>
    <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="3">
      PLATFORMER
    </text>
  </g>
</svg>
