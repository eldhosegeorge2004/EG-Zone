<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="correctGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Ambient Decorative Rings -->
  <circle cx="150" cy="180" r="280" fill="#3b82f6" opacity="0.08" />
  <circle cx="680" cy="420" r="240" fill="#6366f1" opacity="0.12" />

  <!-- Central Floating Crossword Board -->
  <g transform="translate(180, 110)">
    <!-- Board Base Shadow -->
    <rect x="-10" y="-10" width="460" height="420" rx="20" fill="#0f172a" stroke="#334155" stroke-width="3" filter="url(#softGlow)" />

    <!-- Grid Cells (6x5 Crossword pattern mockup) -->
    <!-- Row 0: W O R D S -->
    <!-- (x, y) = col * 70, row * 70 -->
    <!-- Cell 1 (W) -->
    <rect x="20" y="20" width="60" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <text x="26" y="34" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">1</text>
    <text x="50" y="62" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#f8fafc" text-anchor="middle">W</text>

    <!-- Cell 2 (O) -->
    <rect x="90" y="20" width="60" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <text x="120" y="62" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#f8fafc" text-anchor="middle">O</text>

    <!-- Cell 3 (R) -->
    <rect x="160" y="20" width="60" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <text x="166" y="34" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">2</text>
    <text x="190" y="62" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#f8fafc" text-anchor="middle">R</text>

    <!-- Cell 4 (L) -->
    <rect x="230" y="20" width="60" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <text x="260" y="62" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#f8fafc" text-anchor="middle">L</text>

    <!-- Cell 5 (D) -->
    <rect x="300" y="20" width="60" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <text x="330" y="62" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#f8fafc" text-anchor="middle">D</text>

    <!-- Row 1: Vertical intersecting letter from R(2) -> E -->
    <rect x="160" y="90" width="60" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <text x="190" y="132" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#f8fafc" text-anchor="middle">E</text>

    <!-- Row 2: Across word B R A I N -->
    <rect x="20" y="160" width="60" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <text x="26" y="174" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">3</text>
    <text x="50" y="202" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#f8fafc" text-anchor="middle">B</text>

    <rect x="90" y="160" width="60" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <text x="120" y="202" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#f8fafc" text-anchor="middle">R</text>

    <!-- Intersecting A (highlighted selected!) -->
    <rect x="160" y="160" width="60" height="60" rx="8" fill="url(#accentGrad)" stroke="#93c5fd" stroke-width="3" filter="url(#softGlow)" />
    <text x="190" y="202" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">A</text>

    <rect x="230" y="160" width="60" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <text x="260" y="202" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#f8fafc" text-anchor="middle">I</text>

    <rect x="300" y="160" width="60" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <text x="330" y="202" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#f8fafc" text-anchor="middle">N</text>

    <!-- Row 3: Vertical letter D (from READ) -->
    <rect x="160" y="230" width="60" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <text x="190" y="272" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#f8fafc" text-anchor="middle">D</text>

    <!-- Row 4: Across word G A M E S -->
    <rect x="90" y="300" width="60" height="60" rx="8" fill="url(#correctGrad)" stroke="#6ee7b7" stroke-width="2" />
    <text x="96" y="314" font-family="system-ui, sans-serif" font-size="11" fill="#ecfdf5">4</text>
    <text x="120" y="342" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">G</text>

    <rect x="160" y="300" width="60" height="60" rx="8" fill="url(#correctGrad)" stroke="#6ee7b7" stroke-width="2" />
    <text x="190" y="342" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">A</text>

    <rect x="230" y="300" width="60" height="60" rx="8" fill="url(#correctGrad)" stroke="#6ee7b7" stroke-width="2" />
    <text x="260" y="342" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">M</text>

    <rect x="300" y="300" width="60" height="60" rx="8" fill="url(#correctGrad)" stroke="#6ee7b7" stroke-width="2" />
    <text x="330" y="342" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">E</text>

    <rect x="370" y="300" width="60" height="60" rx="8" fill="url(#correctGrad)" stroke="#6ee7b7" stroke-width="2" />
    <text x="400" y="342" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">S</text>
  </g>

  <!-- Pencil / Hint Icon Accent -->
  <g transform="translate(620, 240) rotate(45)">
    <rect x="0" y="0" width="30" height="120" rx="6" fill="#f59e0b" stroke="#fef3c7" stroke-width="2" />
    <polygon points="0,0 15,-30 30,0" fill="#fbbf24" />
    <polygon points="10,-20 15,-30 20,-20" fill="#1e293b" />
    <rect x="0" y="100" width="30" height="20" rx="2" fill="#ef4444" />
  </g>

  <!-- Title Banner -->
  <text x="400" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" text-anchor="middle" fill="#60a5fa" letter-spacing="3" filter="url(#softGlow)">
    CROSSWORD LITE
  </text>
  <text x="400" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#a5b4fc" letter-spacing="4">
    WORD PUZZLE CHALLENGE
  </text>
</svg>
