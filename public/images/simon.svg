<svg xmlns="http://www.w3.org/2000/svg" viewBox="-133.5 0 1067 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#151d30" />
      <stop offset="60%" stop-color="#090d18" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Button Radial Gradients for 3D curved feel -->
    <radialGradient id="greenGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="40%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </radialGradient>

    <radialGradient id="redGrad" cx="70%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="40%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </radialGradient>

    <radialGradient id="yellowGrad" cx="30%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </radialGradient>

    <radialGradient id="blueGrad" cx="70%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="-133.5" y="0" width="1067" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle Acoustic Sound Wave Rings -->
  <circle cx="400" cy="300" r="260" stroke="#38bdf8" stroke-width="1.5" opacity="0.1" fill="none"/>
  <circle cx="400" cy="300" r="285" stroke="#38bdf8" stroke-width="1" opacity="0.05" fill="none"/>

  <!-- Main Simon Device Unit -->
  <g filter="url(#shadow)">
    <!-- Outer Plastic Base Ring -->
    <circle cx="400" cy="300" r="225" fill="#202b40" stroke="#0f172a" stroke-width="8"/>
    
    <!-- Quadrant 1: Top-Left GREEN (Active Glowing) -->
    <path d="M 390 90 A 200 200 0 0 0 190 290 L 320 290 A 70 70 0 0 1 390 220 Z" fill="url(#greenGrad)" filter="url(#neonGlow)"/>
    <path d="M 385 105 A 185 185 0 0 0 205 285 L 295 285 A 95 95 0 0 1 385 195 Z" fill="#4ade80" opacity="0.35"/>

    <!-- Quadrant 2: Top-Right RED -->
    <path d="M 410 90 A 200 200 0 0 1 610 290 L 480 290 A 70 70 0 0 0 410 220 Z" fill="url(#redGrad)"/>
    <path d="M 415 105 A 185 185 0 0 1 595 285 L 505 285 A 95 95 0 0 0 415 195 Z" fill="#ffffff" opacity="0.15"/>

    <!-- Quadrant 3: Bottom-Left YELLOW -->
    <path d="M 190 310 A 200 200 0 0 0 390 510 L 390 380 A 70 70 0 0 1 320 310 Z" fill="url(#yellowGrad)"/>
    <path d="M 205 315 A 185 185 0 0 0 385 495 L 385 405 A 95 95 0 0 1 295 315 Z" fill="#ffffff" opacity="0.15"/>

    <!-- Quadrant 4: Bottom-Right BLUE -->
    <path d="M 610 310 A 200 200 0 0 1 410 510 L 410 380 A 70 70 0 0 0 480 310 Z" fill="url(#blueGrad)"/>
    <path d="M 595 315 A 185 185 0 0 1 415 495 L 415 405 A 95 95 0 0 0 505 315 Z" fill="#ffffff" opacity="0.15"/>

    <!-- Center Control Disc -->
    <circle cx="400" cy="300" r="75" fill="#090d18" stroke="#202b40" stroke-width="8"/>
    <circle cx="400" cy="300" r="62" fill="#0f172a" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>

    <!-- Center Typography -->
    <text x="400" y="286" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#38bdf8" text-anchor="middle" letter-spacing="3">EG ZONE</text>
    <text x="400" y="316" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="1">SIMON</text>
    <text x="400" y="334" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="2">SAYS</text>
  </g>

  <!-- Glowing Sound Particles from Green Button -->
  <circle cx="280" cy="180" r="4" fill="#ffffff" opacity="0.8" filter="url(#neonGlow)"/>
  <circle cx="230" cy="210" r="6" fill="#86efac" opacity="0.7" filter="url(#neonGlow)"/>
</svg>