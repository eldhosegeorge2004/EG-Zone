<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Sky / Sunset Gradient -->
    <radialGradient id="skyGrad" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="35%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0" />
    </radialGradient>

    <!-- Road Surface Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Supercar Red Metallic Gradient -->
    <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="40%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Car Windshield & Glass -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Nitro Exhaust Flame -->
    <linearGradient id="nitroGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>

  <!-- Setting Retro Sun -->
  <circle cx="400" cy="240" r="130" fill="url(#sunGlow)"/>
  <circle cx="400" cy="240" r="80" fill="#f59e0b" opacity="0.85"/>

  <!-- Cyber Horizon Grid Lines -->
  <line x1="0" y1="260" x2="800" y2="260" stroke="#f43f5e" stroke-width="2" opacity="0.3" />
  <line x1="0" y1="275" x2="800" y2="275" stroke="#f43f5e" stroke-width="2" opacity="0.2" />

  <!-- City Skyline Silhouette -->
  <g fill="#0b0f19" opacity="0.85">
    <rect x="50" y="160" width="50" height="100" />
    <rect x="110" y="130" width="45" height="130" />
    <polygon points="120,130 132,100 145,130" />
    <rect x="165" y="180" width="60" height="80" />
    <rect x="235" y="145" width="40" height="115" />
    <rect x="530" y="150" width="55" height="110" />
    <rect x="595" y="125" width="50" height="135" />
    <polygon points="608,125 620,90 632,125" />
    <rect x="655" y="170" width="45" height="90" />
    <rect x="710" y="140" width="60" height="120" />
  </g>

  <!-- Highway Ground Polygon (Perspective) -->
  <polygon points="260,260 540,260 760,600 40,600" fill="url(#roadGrad)"/>

  <!-- Highway Guardrails & Neon Curbs -->
  <polygon points="245,260 260,260 40,600 20,600" fill="#dc2626"/>
  <polygon points="540,260 555,260 780,600 760,600" fill="#dc2626"/>
  <!-- Alternating Curb Stripes Left -->
  <polygon points="247,280 258,280 180,400 160,400" fill="#f8fafc" opacity="0.8"/>
  <polygon points="110,480 140,480 70,550 45,550" fill="#f8fafc" opacity="0.8"/>
  <!-- Alternating Curb Stripes Right -->
  <polygon points="542,280 553,280 640,400 620,400" fill="#f8fafc" opacity="0.8"/>
  <polygon points="660,480 690,480 755,550 730,550" fill="#f8fafc" opacity="0.8"/>

  <!-- Road Lane Dividers (Dashed Perspective) -->
  <!-- Lane 1-2 Divider -->
  <polygon points="330,260 334,260 225,600 215,600" fill="#fbbf24" opacity="0.85"/>
  <!-- Lane 2-3 Center Line (Double Solid / Fast Dashed) -->
  <polygon points="398,260 402,260 405,600 395,600" fill="#f8fafc" opacity="0.9"/>
  <!-- Lane 3-4 Divider -->
  <polygon points="466,260 470,260 585,600 575,600" fill="#fbbf24" opacity="0.85"/>

  <!-- Distant Traffic Cars (Creating Depth) -->
  <!-- Traffic Car 1 (Yellow Coupe in Lane 1) -->
  <g transform="translate(290, 310) scale(0.35)">
    <rect x="-30" y="-50" width="60" height="100" rx="14" fill="#eab308" filter="url(#dropShadow)"/>
    <rect x="-24" y="-20" width="48" height="35" rx="6" fill="#1e293b"/>
    <circle cx="-18" cy="45" r="7" fill="#ef4444" filter="url(#neonGlow)"/>
    <circle cx="18" cy="45" r="7" fill="#ef4444" filter="url(#neonGlow)"/>
  </g>

  <!-- Traffic Car 2 (Blue SUV in Lane 4) -->
  <g transform="translate(510, 340) scale(0.45)">
    <rect x="-35" y="-60" width="70" height="120" rx="12" fill="#0284c7" filter="url(#dropShadow)"/>
    <rect x="-28" y="-30" width="56" height="50" rx="6" fill="#0f172a"/>
    <circle cx="-22" cy="52" r="8" fill="#ef4444" filter="url(#neonGlow)"/>
    <circle cx="22" cy="52" r="8" fill="#ef4444" filter="url(#neonGlow)"/>
  </g>

  <!-- Nitro Booster Exhaust Plumes under Hero Car -->
  <polygon points="360,540 375,540 370,610 365,610" fill="url(#nitroGrad)" filter="url(#neonGlow)"/>
  <polygon points="425,540 440,540 435,610 430,610" fill="url(#nitroGrad)" filter="url(#neonGlow)"/>

  <!-- Speed Motion Streaks -->
  <line x1="260" y1="460" x2="240" y2="580" stroke="#38bdf8" stroke-width="2.5" opacity="0.6" stroke-dasharray="20 15"/>
  <line x1="535" y1="450" x2="560" y2="580" stroke="#38bdf8" stroke-width="2.5" opacity="0.6" stroke-dasharray="25 15"/>
  <line x1="330" y1="480" x2="310" y2="590" stroke="#f43f5e" stroke-width="2" opacity="0.7" stroke-dasharray="30 20"/>
  <line x1="470" y1="490" x2="490" y2="590" stroke="#f43f5e" stroke-width="2" opacity="0.7" stroke-dasharray="30 20"/>

  <!-- Hero Supercar (High-detail 3D Top-Down/Slight-Angle Perspective) -->
  <g transform="translate(400, 480)" filter="url(#dropShadow)">
    <!-- Rear Tire Shadows & Wheels -->
    <rect x="-68" y="10" width="18" height="42" rx="6" fill="#090d16"/>
    <rect x="50" y="10" width="18" height="42" rx="6" fill="#090d16"/>
    <!-- Front Wheels -->
    <rect x="-65" y="-85" width="16" height="38" rx="5" fill="#090d16"/>
    <rect x="49" y="-85" width="16" height="38" rx="5" fill="#090d16"/>

    <!-- Main Aerodynamic Body Shell -->
    <path d="M-45,-100 C-30,-115 30,-115 45,-100 C58,-65 64,-10 60,45 C58,60 52,65 35,68 C20,70 -20,70 -35,68 C-52,65 -58,60 -60,45 C-64,-10 -58,-65 -45,-100 Z" fill="url(#carBodyGrad)"/>

    <!-- Hood Scoops & Aerodynamic Cuts -->
    <polygon points="-16,-90 0,-95 16,-90 12,-65 -12,-65" fill="#0f172a" opacity="0.6"/>
    <line x1="0" y1="-95" x2="0" y2="-45" stroke="#f43f5e" stroke-width="2" opacity="0.8"/>

    <!-- Cockpit & Tinted Windshield -->
    <path d="M-36,-42 C-25,-55 25,-55 36,-42 C40,-15 40,15 35,30 C20,34 -20,34 -35,30 C-40,15 -40,-15 -36,-42 Z" fill="#0f172a"/>
    <path d="M-30,-38 C-20,-48 20,-48 30,-38 C34,-25 34,-10 32,5 C18,8 -18,8 -32,5 C-34,-10 -34,-25 -30,-38 Z" fill="url(#glassGrad)" opacity="0.85"/>

    <!-- Sleek Roof Panel -->
    <polygon points="-22,-5 22,-5 18,22 -18,22" fill="#e11d48"/>

    <!-- Rear Carbon Wing / Spoiler -->
    <rect x="-56" y="52" width="112" height="12" rx="3" fill="#020617"/>
    <rect x="-38" y="44" width="8" height="12" fill="#475569"/>
    <rect x="30" y="44" width="8" height="12" fill="#475569"/>

    <!-- Glowing Tail Lights (Neon Bar) -->
    <rect x="-50" y="60" width="100" height="5" rx="2.5" fill="#ff0055" filter="url(#neonGlow)"/>

    <!-- Dual Exhaust Pipes -->
    <circle cx="-25" cy="68" r="4.5" fill="#94a3b8"/>
    <circle cx="25" cy="68" r="4.5" fill="#94a3b8"/>
    <circle cx="-25" cy="68" r="2.5" fill="#0284c7" filter="url(#neonGlow)"/>
    <circle cx="25" cy="68" r="2.5" fill="#0284c7" filter="url(#neonGlow)"/>
  </g>

  <!-- Title Badge Banner Overlay -->
  <g transform="translate(400, 75)">
    <!-- Glowing Badge Pill -->
    <rect x="-210" y="-35" width="420" height="70" rx="35" fill="#090d16" fill-opacity="0.92" stroke="#f43f5e" stroke-width="2.5" filter="url(#neonGlow)"/>
    <text x="0" y="6" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="3">HIGHWAY RACER</text>
    <text x="0" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#38bdf8" text-anchor="middle" letter-spacing="4">TURBO SPEED 3D</text>
  </g>
</svg>